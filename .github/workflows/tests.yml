name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cloudrun/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache numba kernels
        uses: actions/cache@v4
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-${{ hashFiles('cloudrun/coffeegrindsize_core/_kernels.py') }}
      - name: pytest (including slow cases)
        run: pytest -m ""

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: React/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: React/frontend/package-lock.json
      - run: npm ci
      - name: Protected files unchanged (Firebase config, map code, backend)
        run: node scripts/check-protected.mjs
      - name: Unit tests
        run: npm run test:unit
      - name: Production build (dummy Firebase config)
        env:
          VITE_FIREBASE_API_KEY: ci-dummy
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.com
          VITE_FIREBASE_PROJECT_ID: ci-dummy
          VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-dummy
          VITE_ALLOWED_EMAIL: ci@example.com
        run: npm run build

  e2e:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloudrun/requirements.txt
      - run: pip install -r cloudrun/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: React/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: React/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: React/frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: React/frontend
        env:
          CI: '1'
          PYTHON: python
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            React/frontend/playwright-report/
            React/frontend/test-results/
          retention-days: 7
